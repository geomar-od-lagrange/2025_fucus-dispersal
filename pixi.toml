[workspace]
authors = ["Willi Rath <wrath@geomar.de>"]
channels = ["conda-forge"]
name = "fucus-dispersal"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[dependencies]
bottleneck = ">=1.4"
cartopy = ">=0.25.0,<0.26"
dask = ">=2025.1.0"
distributed = ">=2025.1.0"
geopandas = ">=1.1.3,<2"
ipykernel = ">=7.2.0,<8"
jupytext = ">=1.19.1,<2"
matplotlib = ">=3.10.0,<4"
nbconvert = ">=7.17.1,<8"
netcdf4 = ">=1.7.4,<2"
numpy = ">=1.26"
pandas = ">=2.2"
papermill = ">=2.6"
scipy = ">=1.14"
shapely = ">=2.0"
xarray = ">=2025.1.0"
xhistogram = ">=0.3.2"
zarr = ">=2.18"

[pypi-dependencies]
hextraj = { version = "*", extras = ["full"] }
